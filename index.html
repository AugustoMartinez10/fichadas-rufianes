<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fichar">
<title>Fichar</title>

<!-- Abre el TLS con Apps Script mientras se parsea el HTML.
     Ahorra el handshake completo del primer pedido. -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.google.com">

<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --linea:#334155;
    --txt:#f1f5f9; --txt2:#94a3b8;
    --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --info:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--txt);
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .app{width:100%; max-width:420px}
  .pantalla{display:none}
  .pantalla.activa{display:block; animation:entrar .25s ease}
  @keyframes entrar{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .sucursal{
    text-align:center; font-size:13px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--txt2); margin-bottom:28px;
  }
  .saludo{font-size:26px; font-weight:600; text-align:center; margin-bottom:8px}

  .estado{
    background:var(--card); border:1px solid var(--linea); border-radius:16px;
    padding:22px; text-align:center; margin-bottom:24px;
  }
  .estado .label{font-size:12px; color:var(--txt2); text-transform:uppercase; letter-spacing:.06em}
  .estado .valor{font-size:30px; font-weight:700; margin:6px 0 2px}
  .estado .desde{font-size:14px; color:var(--txt2); min-height:20px}
  .adentro{color:var(--ok)} .afuera{color:var(--txt2)}

  /* Placeholder mientras llega el estado real desde el servidor.
     Reemplaza al spinner a pantalla completa: la pantalla aparece
     entera y solo late el dato que todavía no se sabe. */
  .skel{
    display:inline-block; height:30px; width:150px; border-radius:8px;
    background:linear-gradient(90deg,#334155 25%,#475569 50%,#334155 75%);
    background-size:200% 100%; animation:latir 1.2s ease-in-out infinite;
    vertical-align:middle; margin:6px 0 2px;
  }
  @keyframes latir{0%{background-position:200% 0}100%{background-position:-200% 0}}

  .aviso{
    font-size:15px; text-align:center; color:var(--txt2); margin-bottom:18px;
    min-height:22px;
  }
  .aviso b{color:var(--txt); font-weight:600}

  button{
    width:100%; border:0; border-radius:14px; padding:20px;
    font-size:19px; font-weight:600; font-family:inherit;
    cursor:pointer; transition:transform .1s, opacity .2s, background .2s;
  }
  button:active{transform:scale(.98)}
  button:disabled{opacity:.45; cursor:default}
  .primario{background:var(--info); color:#fff}
  .primario.salida{background:var(--warn); color:#1f1300}
  .secundario{background:transparent; color:var(--txt2); font-size:15px; padding:14px; margin-top:12px}

  .lista button{
    background:var(--card); border:1px solid var(--linea); color:var(--txt);
    text-align:left; padding:18px; margin-bottom:10px; font-size:17px;
  }

  .resultado{text-align:center; padding:12px 0}
  .icono{font-size:64px; margin-bottom:14px; line-height:1}
  .resultado h2{font-size:26px; margin-bottom:6px}
  .hora{font-size:44px; font-weight:700; letter-spacing:-.02em; margin:10px 0}
  .detalle{font-size:15px; color:var(--txt2); line-height:1.5}

  .chip{
    display:inline-block; font-size:12px; padding:5px 11px; border-radius:99px;
    margin-top:14px; font-weight:500;
  }
  .chip.ok{background:rgba(34,197,94,.15); color:var(--ok)}
  .chip.no{background:rgba(245,158,11,.15); color:var(--warn)}
  .chip.sin{background:rgba(148,163,184,.15); color:var(--txt2)}

  .spinner{
    width:38px; height:38px; margin:0 auto 18px;
    border:3px solid var(--linea); border-top-color:var(--info);
    border-radius:50%; animation:girar .8s linear infinite;
  }
  @keyframes girar{to{transform:rotate(360deg)}}
  .cargando{text-align:center; color:var(--txt2); padding:40px 0}
</style>
</head>
<body>
<div class="app">

  <!-- Carga inicial: solo se ve la primera vez, sin datos en el celular -->
  <div id="p-carga" class="pantalla activa">
    <div class="cargando">
      <div class="spinner"></div>
      <div id="carga-txt">Conectando…</div>
    </div>
  </div>

  <!-- Alta: elegir empleado (solo la primera vez) -->
  <div id="p-alta" class="pantalla">
    <div class="sucursal" id="alta-suc"></div>
    <div class="saludo" style="margin-bottom:22px">¿Quién sos?</div>
    <div class="lista" id="alta-lista"></div>
  </div>

  <!-- Pantalla principal -->
  <div id="p-main" class="pantalla">
    <div class="sucursal" id="main-suc"></div>
    <div class="saludo" id="main-nombre"></div>
    <div class="estado">
      <div class="label">Estado actual</div>
      <div class="valor" id="main-estado"><span class="skel"></span></div>
      <div class="desde" id="main-desde"></div>
    </div>
    <div class="aviso" id="main-aviso"></div>
    <button class="primario" id="btn-fichar" disabled>Consultando…</button>
    <button class="secundario" id="btn-cambiar">No sos vos? Cambiar persona</button>
  </div>

  <!-- Enviando -->
  <div id="p-envio" class="pantalla">
    <div class="cargando">
      <div class="spinner"></div>
      <div id="envio-txt">Registrando…</div>
    </div>
  </div>

  <!-- Resultado -->
  <div id="p-fin" class="pantalla">
    <div class="resultado">
      <div class="icono" id="fin-icono"></div>
      <h2 id="fin-titulo"></h2>
      <div class="hora" id="fin-hora"></div>
      <div class="detalle" id="fin-detalle"></div>
      <div id="fin-chip"></div>
    </div>
    <button class="secundario" id="btn-volver" style="margin-top:26px">Volver</button>
  </div>

</div>

<script>
/* =====================================================================
 * FICHAR — Frontend
 *
 * ⚠️ ÚNICO VALOR A COMPLETAR: pegá abajo la URL de la aplicación web
 * de Apps Script (la que termina en /exec).
 *
 * ESTRATEGIA DE VELOCIDAD
 * Lo que se percibe como lentitud son tres esperas en serie. Acá las
 * tres se atacan distinto:
 *
 *  1. El GPS tarda entre 3 y 8 segundos y antes arrancaba recién al
 *     tocar el botón. Ahora se pide AL CARGAR, en paralelo con todo lo
 *     demás, así para cuando el empleado toca ya está resuelto.
 *  2. Había dos viajes al servidor (config y estado). Ahora es uno solo.
 *  3. La pantalla esperaba a tener todos los datos. Ahora se dibuja al
 *     instante con lo guardado en el celular y solo late el estado.
 * ===================================================================== */
const API = 'https://script.google.com/macros/s/AKfycbyEGzy51PBl4nom-2yMLc-w7Hl8sH4V4wxWS0XnOWtH8wtQohK9yRYKNO2U7JWR0kM-/exec';

/* La sucursal viene en el QR: .../index.html?s=S01
   Así el empleado nunca elige sucursal y no se puede equivocar de local. */
const SUCURSAL = new URLSearchParams(location.search).get('s') || '';

const CLAVE_EMPLEADO = 'fichar_empleado_' + SUCURSAL;
const CLAVE_CONFIG   = 'fichar_config_' + SUCURSAL;

/* Una posición más vieja que esto se vuelve a pedir. 90 segundos es
   holgado para un geofence de 150 m: nadie recorre esa distancia
   mientras mira la pantalla de confirmación. */
const GEO_VIGENCIA_MS = 90000;

let config = null;
let empleadoId = null;
let proximoTipo = 'ENTRADA';

const $ = function (id) { return document.getElementById(id); };

function mostrar(pantalla) {
  document.querySelectorAll('.pantalla').forEach(function (p) {
    p.classList.remove('activa');
  });
  $(pantalla).classList.add('activa');
}

function leerLocal(clave) {
  try { return JSON.parse(localStorage.getItem(clave)); } catch (e) { return null; }
}

function guardarLocal(clave, valor) {
  try { localStorage.setItem(clave, JSON.stringify(valor)); } catch (e) {}
}


/* ---------------------------------------------------------------------
 * UBICACIÓN
 *
 * Se pide apenas se sabe quién está fichando, no cuando toca el botón.
 * Ese adelanto es la mayor parte de la mejora de velocidad.
 * ------------------------------------------------------------------- */
let geoGuardada = null;   // { datos, ts }
let geoEnCurso = null;    // Promise en vuelo, para no pedir dos veces

function pedirUbicacion() {
  if (geoEnCurso) return geoEnCurso;

  geoEnCurso = new Promise(function (resolve) {
    if (!navigator.geolocation) return resolve({});
    navigator.geolocation.getCurrentPosition(
      function (pos) {
        resolve({
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          precision: Math.round(pos.coords.accuracy)
        });
      },
      // Si el empleado niega el permiso o el GPS falla, la fichada se
      // manda igual y queda marcada como SIN_GPS. Nunca se le bloquea
      // el fichaje a alguien por un permiso del navegador.
      function () { resolve({}); },
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
    );
  }).then(function (d) {
    geoGuardada = { datos: d, ts: Date.now() };
    geoEnCurso = null;
    return d;
  });

  return geoEnCurso;
}

function ubicacion() {
  const fresca = geoGuardada &&
                 geoGuardada.datos.lat != null &&
                 (Date.now() - geoGuardada.ts) < GEO_VIGENCIA_MS;
  if (fresca) return Promise.resolve(geoGuardada.datos);
  return pedirUbicacion();
}


/* ---------------------------------------------------------------------
 * SERVIDOR
 * ------------------------------------------------------------------- */

/* Un solo pedido trae sucursal, empleados y (si ya sabemos quién es)
   el estado del día. Antes esto eran dos viajes encadenados. */
function pedirInicio(empleado) {
  let url = API + '?action=inicio&s=' + encodeURIComponent(SUCURSAL);
  if (empleado) url += '&e=' + encodeURIComponent(empleado);
  return fetch(url).then(function (r) { return r.json(); });
}

function empleadoPorId(id) {
  if (!config || !config.empleados) return null;
  return config.empleados.filter(function (e) {
    return String(e.empleado) === String(id);
  })[0] || null;
}


/* ---------------------------------------------------------------------
 * ARRANQUE
 * ------------------------------------------------------------------- */
async function iniciar() {
  if (!SUCURSAL) {
    return fallar('Falta la sucursal', 'Este link no tiene sucursal. Escaneá el QR del local.');
  }
  if (API.indexOf('PEGAR_ACA') === 0) {
    return fallar('Sin configurar', 'Falta pegar la URL de la aplicación web en el código.');
  }

  empleadoId = localStorage.getItem(CLAVE_EMPLEADO) || null;
  config = leerLocal(CLAVE_CONFIG);

  // Pintado optimista: si el celular ya conoce la sucursal y a la
  // persona, la pantalla aparece completa antes de hablar con nadie.
  if (config && empleadoId && empleadoPorId(empleadoId)) {
    pintarShell();
    mostrar('p-main');
    pedirUbicacion();          // arranca el GPS ya, sin esperar nada
  } else if (config) {
    pintarAlta();
    mostrar('p-alta');
  } else {
    mostrar('p-carga');
  }

  // Y en paralelo, la verdad del servidor.
  let d;
  try {
    d = await pedirInicio(empleadoId);
  } catch (err) {
    if (config && empleadoId) {
      return errorEnMain('Sin conexión. Probá de nuevo.');
    }
    return fallar('Sin conexión', 'No se pudo contactar al servidor. Revisá los datos o el wifi.');
  }

  if (!d.ok) {
    return fallar('Sucursal desconocida', d.error || 'El código "' + SUCURSAL + '" no figura en el sistema.');
  }

  config = { sucursal: d.sucursal, empleados: d.empleados };
  guardarLocal(CLAVE_CONFIG, config);

  // Si el empleado guardado ya no está en la lista (se dio de baja),
  // se vuelve a preguntar.
  if (empleadoId && !empleadoPorId(empleadoId)) {
    localStorage.removeItem(CLAVE_EMPLEADO);
    empleadoId = null;
  }

  if (!empleadoId) {
    pintarAlta();
    return mostrar('p-alta');
  }

  pintarShell();
  aplicarEstado(d);
  mostrar('p-main');
}

function pintarShell() {
  const emp = empleadoPorId(empleadoId);
  $('main-suc').textContent = config.sucursal.nombre;
  $('main-nombre').textContent = emp ? 'Hola, ' + emp.nombre : '';
}

function pintarAlta() {
  $('alta-suc').textContent = config.sucursal.nombre;

  const lista = $('alta-lista');
  lista.innerHTML = '';

  config.empleados.forEach(function (e) {
    const b = document.createElement('button');
    b.textContent = e.nombre;
    b.onclick = function () { elegir(e.empleado); };
    lista.appendChild(b);
  });
}

async function elegir(id) {
  empleadoId = id;
  localStorage.setItem(CLAVE_EMPLEADO, id);

  pedirUbicacion();   // acá sí: ya eligió, el permiso tiene contexto
  pintarShell();
  esperandoEstado();
  mostrar('p-main');

  try {
    const d = await pedirInicio(id);
    if (!d.ok) return errorEnMain(d.error || 'Error del servidor.');
    aplicarEstado(d);
  } catch (err) {
    errorEnMain('Sin conexión. Probá de nuevo.');
  }
}

function esperandoEstado() {
  $('main-estado').innerHTML = '<span class="skel"></span>';
  $('main-estado').className = 'valor';
  $('main-desde').textContent = '';
  $('main-aviso').textContent = '';
  const btn = $('btn-fichar');
  btn.textContent = 'Consultando…';
  btn.className = 'primario';
  btn.disabled = true;
  btn.onclick = fichar;
}

/* El estado real recién llegado del servidor. El botón se habilita solo
   acá: nunca se deja fichar sobre un dato viejo del celular. */
function aplicarEstado(d) {
  const adentro = d.estado === 'ADENTRO';
  proximoTipo = d.proximo || 'ENTRADA';

  $('main-estado').textContent = adentro ? 'ADENTRO' : 'AFUERA';
  $('main-estado').className = 'valor ' + (adentro ? 'adentro' : 'afuera');
  $('main-desde').textContent = adentro && d.desde ? 'Desde las ' + d.desde.substring(0, 5) : '';

  $('main-aviso').innerHTML = 'Vas a registrar tu <b>' + proximoTipo + '</b>';

  const btn = $('btn-fichar');
  btn.textContent = 'Registrar ' + proximoTipo.toLowerCase();
  btn.className = 'primario' + (proximoTipo === 'SALIDA' ? ' salida' : '');
  btn.disabled = false;
  btn.onclick = fichar;
}

function errorEnMain(msg) {
  $('main-estado').textContent = '—';
  $('main-estado').className = 'valor afuera';
  $('main-desde').textContent = '';
  $('main-aviso').textContent = msg;
  const btn = $('btn-fichar');
  btn.textContent = 'Reintentar';
  btn.className = 'primario';
  btn.disabled = false;
  btn.onclick = reintentar;
}

async function reintentar() {
  esperandoEstado();
  try {
    const d = await pedirInicio(empleadoId);
    if (!d.ok) return errorEnMain(d.error || 'Error del servidor.');
    aplicarEstado(d);
  } catch (err) {
    errorEnMain('Sigue sin conexión.');
  }
}


/* ---------------------------------------------------------------------
 * FICHADA
 * ------------------------------------------------------------------- */
async function fichar() {
  $('btn-fichar').disabled = true;

  // En el caso normal esto ya está resuelto desde que cargó la pantalla
  // y no espera nada. Solo si el GPS falló o venció se pide de nuevo.
  const pendiente = !geoGuardada || geoGuardada.datos.lat == null;
  $('envio-txt').textContent = pendiente ? 'Ubicando…' : 'Registrando…';
  mostrar('p-envio');

  const geo = await ubicacion();
  $('envio-txt').textContent = 'Registrando…';

  const cuerpo = {
    sucursal: SUCURSAL,
    empleado: empleadoId,
    lat: geo.lat,
    lng: geo.lng,
    precision: geo.precision,
    dispositivo: navigator.userAgent
  };

  let res;
  try {
    // Sin headers a propósito: un body de tipo string hace que el
    // navegador mande text/plain, lo que evita el preflight CORS.
    // Apps Script no responde preflight, así que agregar
    // 'Content-Type: application/json' rompe el pedido.
    res = await (await fetch(API, { method: 'POST', body: JSON.stringify(cuerpo) })).json();
  } catch (err) {
    return fallar('No se pudo registrar', 'Revisá la conexión y probá de nuevo. No quedó registrado.');
  }

  if (!res.ok) return fallar('No se pudo registrar', res.error || 'Error del servidor.');

  mostrarResultado(res);
}

function mostrarResultado(res) {
  const dup = res.tipo === 'DUPLICADO';
  const entrada = res.tipo === 'ENTRADA';

  $('fin-icono').textContent = dup ? '🤚' : (entrada ? '✅' : '👋');
  $('fin-titulo').textContent = dup ? 'Ya estabas fichado'
                                    : (entrada ? 'Entrada registrada' : 'Salida registrada');
  $('fin-hora').textContent = res.hora ? res.hora.substring(0, 5) : '';
  $('fin-detalle').textContent = dup
    ? 'Tu fichada anterior sigue siendo la válida.'
    : res.empleado + ' · ' + res.sucursal;

  let chip = '';
  if (res.geo_ok === 'SI') {
    chip = '<span class="chip ok">📍 Ubicación verificada</span>';
  } else if (res.geo_ok === 'NO') {
    chip = '<span class="chip no">📍 Lejos del local (' + res.distancia_m + ' m)</span>';
  } else {
    chip = '<span class="chip sin">📍 Sin ubicación</span>';
  }
  $('fin-chip').innerHTML = chip;

  mostrar('p-fin');
}

function fallar(titulo, detalle) {
  $('fin-icono').textContent = '⚠️';
  $('fin-titulo').textContent = titulo;
  $('fin-hora').textContent = '';
  $('fin-detalle').textContent = detalle;
  $('fin-chip').innerHTML = '';
  mostrar('p-fin');
}


/* ---------------------------------------------------------------------
 * EVENTOS
 * ------------------------------------------------------------------- */
$('btn-fichar').onclick = fichar;

$('btn-volver').onclick = function () {
  if (empleadoId && config) {
    pintarShell();
    esperandoEstado();
    mostrar('p-main');
    reintentar();
  } else {
    location.reload();
  }
};

$('btn-cambiar').onclick = function () {
  localStorage.removeItem(CLAVE_EMPLEADO);
  empleadoId = null;
  pintarAlta();
  mostrar('p-alta');
};

iniciar();
</script>
</body>
</html>
